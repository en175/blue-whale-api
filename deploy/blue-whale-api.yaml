apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-whale-api
  namespace: default
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: blue-whale-api
  template:
    metadata:
      labels:
        app: blue-whale-api
    spec:
      terminationGracePeriodSeconds: 150
      imagePullSecrets:
      - name: ccr-secret
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - blue-whale-api
            topologyKey: kubernetes.io/hostname
      containers:
      - name: blue-whale-api
        image: "$(parameters.image_repository):$(parameters.image_tag)"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          protocol: TCP
        envFrom:
        - secretRef:
            name: app-secrets
        env:
        - name: PORT
          value: "3000"
        startupProbe:
          httpGet:
            path: /api/status
            port: 3000
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/status
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/status
            port: 3000
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: blue-whale-api-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: blue-whale-api
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30080
    protocol: TCP
